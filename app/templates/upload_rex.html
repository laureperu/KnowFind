
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Ajouter un retour d'expérience</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f8fafc;
            margin: 0;
            padding: 2rem;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            max-width: 800px;
            margin: auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
        }
        h2 {
            color: #1e293b;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 1rem;
            margin-bottom: 1rem;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
        }
        .upload-wrapper {
            margin: 1.5rem 0;
        }
        .upload-btn {
            background-color: #0284c7;
            color: white;
            padding: 1rem 1.5rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .upload-btn:hover {
            background-color: #0369a1;
        }
        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Ajouter un retour d'expérience</h2>
        <input type="text" placeholder="Client">
        <input type="text" placeholder="Contexte de mission">
        <input type="text" placeholder="Problème rencontré">
        <input type="text" placeholder="Solutions apportées">
        <input type="text" placeholder="Résultats / enseignements clés">

        <div class="upload-wrapper">
            <label for="pdf-upload" class="upload-btn">Uploader un document PDF</label>
            <input type="file" id="pdf-upload" accept="application/pdf" onchange="goToChatbot()">
        </div>
    </div>

    <script>
        function goToChatbot() {
            window.location.href = "chatbot.html";
        }
    </script>
</body>
</html>
